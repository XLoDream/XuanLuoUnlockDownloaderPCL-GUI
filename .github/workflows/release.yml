name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd Patcher
          ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            Patcher/XuanLuoUnlockDownloaderPCL-GUI.exe
            Patcher/README.md
            Patcher/build.ps1
            Patcher/.gitignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Package
        run: |
          cd release
          zip -r "XuanLuoUnlockDownloaderPCL-GUI-${GITHUB_REF_NAME}.zip" *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XuanLuoUnlockDownloaderPCL-GUI ${{ github.ref_name }}
          body: |
            ## XuanLuoUnlockDownloaderPCL-GUI ${{ github.ref_name }}

            恢复 PCL2 启动器中被屏蔽的 Minecraft 原版下载、版本修改和整合包安装入口。

            ### 内含文件
            - `XuanLuoUnlockDownloaderPCL-GUI.exe` — 自包含可执行文件（内嵌 dnlib）
            - `README.md` — 使用与构建说明
            - `build.ps1` — 一键构建脚本
            - `.gitignore`

            ### 运行
            ```powershell
            .\XuanLuoUnlockDownloaderPCL-GUI.exe
            ```
          files: release/*.zip
          generate_release_notes: true
